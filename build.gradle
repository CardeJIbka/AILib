plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Loom сам добавляет репозитории Minecraft/Fabric — этот блок нужен только
	// для СВОИХ дополнительных зависимостей (например, если понадобится JNA,
	// commons-compress и т.п. — см. пример ниже).
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ailib" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Версии смотри в gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Технически опционально, но почти всегда нужно.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JNA нигде в текущем коде не используется (все нативные бинарники запускаются
	// через ProcessBuilder, а не через прямые нативные вызовы) — поэтому убрана.
	// Если понадобится (например, для перечисления аудио-устройств или глобальных
	// хоткеев), подключай её ЧЕРЕЗ `include`, а не `implementation`/`modImplementation`,
	// иначе она не попадёт в финальный jar и у игроков будет ClassNotFoundException:
	//
	// include "net.java.dev.jna:jna:5.14.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	// Loom автоматически прикрепит sourcesJar к RemapSourcesJar и к таску "build".
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	// Лицензии сторонних компонентов (llama.cpp / whisper.cpp / piper / модели),
	// которые библиотека скачивает в рантайме, НЕ входят в jar — они не
	// распространяются вместе с модом, а тянутся отдельно на машине игрока.
	// См. THIRD_PARTY_NOTICES.md в корне репозитория.
}

// Настройка Maven-публикации — заполни repositories, когда решишь, куда публиковать
// артефакт (например, свой Maven-репозиторий или Modrinth/CurseForge через отдельный плагин).
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Например:
		// maven {
		//     name = "MyRepo"
		//     url = uri("https://maven.example.com/releases")
		//     credentials {
		//         username = project.findProperty("mavenUser") ?: System.getenv("MAVEN_USER")
		//         password = project.findProperty("mavenPassword") ?: System.getenv("MAVEN_PASSWORD")
		//     }
		// }
	}
}